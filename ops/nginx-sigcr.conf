server {
    listen 80;
    server_name sigcr.com.br;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name sigcr.com.br;
    ssl_certificate /etc/letsencrypt/live/sigcr.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigcr.com.br/privkey.pem;
    root /opt/sigcr/frontend/current;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        root /opt/sigcr/frontend/shared;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /static/ {
        root /opt/sigcr/frontend/shared;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
